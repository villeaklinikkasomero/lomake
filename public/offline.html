<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ei verkkoyhteyttä – Kohtaamiset</title>
  <link rel="stylesheet" href="/offline.css">
</head>
<body>
  <main class="offline">
    <svg class="offline-art" viewBox="0 0 320 150" role="img" aria-label="Piirros: johto on katkennut kahtia, ja pistoke näyttää harmistuneelta">
      <!-- vasen johto ja pistoke -->
      <g class="offline-left">
        <path class="cable" d="M-10 110 C 30 110, 40 70, 80 78 S 115 96, 122 84" fill="none" stroke="#0b0b0c" stroke-width="7" stroke-linecap="round"/>
        <rect x="118" y="62" width="34" height="40" rx="9" fill="#0037D3"/>
        <rect x="152" y="70" width="14" height="5" rx="2" fill="#919396"/>
        <rect x="152" y="89" width="14" height="5" rx="2" fill="#919396"/>
        <circle cx="129" cy="78" r="2.6" fill="#fff"/>
        <circle cx="141" cy="78" r="2.6" fill="#fff"/>
        <path d="M128 93 q7 -6 14 0" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
      </g>
      <!-- kipinät -->
      <g class="offline-sparks" fill="#FFE000" stroke="#0b0b0c" stroke-width="1.5" stroke-linejoin="round">
        <path d="M186 50 l5 10 l-6 1 l7 12 l-12 -10 l6 -1 z"/>
        <path d="M200 98 l9 4 l-4 4 l10 4 l-14 1 l3 -4 z"/>
        <circle cx="178" cy="112" r="3"/>
      </g>
      <!-- oikea johto ja pistorasia -->
      <g class="offline-right">
        <path class="cable" d="M330 52 C 290 52, 285 92, 252 86 S 232 74, 228 84" fill="none" stroke="#0b0b0c" stroke-width="7" stroke-linecap="round"/>
        <rect x="212" y="62" width="34" height="40" rx="9" fill="#00A0F4"/>
        <rect x="218" y="71" width="9" height="4" rx="2" fill="#0b0b0c"/>
        <rect x="218" y="89" width="9" height="4" rx="2" fill="#0b0b0c"/>
      </g>
      <text class="offline-zzz" x="250" y="40" fill="#919396" font-size="15" font-weight="700">z<tspan dx="3" dy="-7" font-size="12">z</tspan><tspan dx="3" dy="-6" font-size="9">z</tspan></text>
    </svg>
    <h1>Hups, johto irti!</h1>
    <p>Puhelin ei saa nyt yhteyttä verkkoon. Kohtaamisten kirjaaminen vaatii verkkoyhteyden – tarkista Wi-Fi tai mobiilidata ja yritä uudelleen.</p>
    <p class="note">Kirjauksia ei tallenneta puhelimeen – ne lähtevät palvelimelle vasta, kun yhteys toimii.</p>
    <p><a class="btn" href="/">Yritä uudelleen</a></p>
  </main>
</body>
</html>
